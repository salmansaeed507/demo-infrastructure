name: demo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    image: demo-api-gateway:${API_GATEWAY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/demo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOGIN_TOKEN: ${LOGIN_TOKEN:?LOGIN_TOKEN is required}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-86400}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://demo.salmansaeed507.com}
      CUSTOMER_SUPPORT_URL: ${CUSTOMER_SUPPORT_URL:-http://customer-support-agent:8000}
      LEAD_QUALIFICATION_URL: ${LEAD_QUALIFICATION_URL:-http://lead-qualification-system:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_GATEWAY_PORT:-5070}:5070"

volumes:
  postgres_data:
