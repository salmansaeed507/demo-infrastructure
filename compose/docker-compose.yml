name: demo

# Shared by the API and the RAG worker (same image, different command).
x-customer-support-service: &customer-support-service
  image: demo-customer-support-agent:${CUSTOMER_SUPPORT_TAG:-latest}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/demo}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-gpt-5.4-mini}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
    AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    image: demo-api-gateway:${API_GATEWAY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/demo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOGIN_TOKEN: ${LOGIN_TOKEN:?LOGIN_TOKEN is required}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-86400}
      PURGE_INACTIVE_SESSIONS_CRON: ${PURGE_INACTIVE_SESSIONS_CRON:-0 */2 * * *}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://demo.salmansaeed507.com}
      CUSTOMER_SUPPORT_URL: ${CUSTOMER_SUPPORT_URL:-http://customer-support-agent:8000}
      LEAD_QUALIFICATION_URL: ${LEAD_QUALIFICATION_URL:-http://lead-qualification-system:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
    ports:
      - "${API_GATEWAY_PORT:-5070}:5070"

  customer-support-agent:
    <<: *customer-support-service

  customer-support-rag-worker:
    <<: *customer-support-service
    command: ["arq", "src.rag.worker.WorkerSettings"]

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /srv/rustfs/data:/data

volumes:
  postgres_data:
