name: Deploy API Gateway

on:
  repository_dispatch:
    types: [deploy-api-gateway]
  workflow_dispatch:
    inputs:
      ref:
        description: api-gateway git ref (branch, tag, or SHA)
        required: false
        default: main
      csa_ref:
        description: customer-support-agent git ref (branch, tag, or SHA)
        required: false
        default: main

permissions:
  contents: read

env:
  API_GATEWAY_IMAGE: demo-api-gateway
  CSA_IMAGE: demo-customer-support-agent
  COMPOSE_DIR: /var/www/compose

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve api-gateway ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "value=${{ github.event.client_payload.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve customer-support-agent ref
        id: csa_ref
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "value=${{ github.event.client_payload.csa_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.csa_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Checkout api-gateway
        uses: actions/checkout@v4
        with:
          repository: salmansaeed507/demo-api-gateway
          ref: ${{ steps.ref.outputs.value }}
          path: api-gateway

      - name: Checkout customer-support-agent
        uses: actions/checkout@v4
        with:
          repository: salmansaeed507/demo-customer-support-agent
          ref: ${{ steps.csa_ref.outputs.value }}
          path: customer-support-agent

      - name: Set image tags
        id: tag
        run: |
          REF="${{ steps.ref.outputs.value }}"
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "api_gateway=${REF:0:12}" >> "$GITHUB_OUTPUT"
          else
            echo "api_gateway=${REF//\//-}" >> "$GITHUB_OUTPUT"
          fi

          CSA_REF="${{ steps.csa_ref.outputs.value }}"
          if [[ "$CSA_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "csa=${CSA_REF:0:12}" >> "$GITHUB_OUTPUT"
          else
            echo "csa=${CSA_REF//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy common module to customer-support-agent
        run: cp -r api-gateway/common customer-support-agent/

      - name: Build api-gateway image
        working-directory: api-gateway
        run: |
          TAG="${{ steps.tag.outputs.api_gateway }}"
          docker build \
            -t "${{ env.API_GATEWAY_IMAGE }}:${TAG}" \
            -t "${{ env.API_GATEWAY_IMAGE }}:latest" \
            .
          docker save \
            "${{ env.API_GATEWAY_IMAGE }}:${TAG}" \
            "${{ env.API_GATEWAY_IMAGE }}:latest" \
            | gzip > ../api-gateway-image.tar.gz

      - name: Build customer-support-agent image
        working-directory: customer-support-agent
        run: |
          TAG="${{ steps.tag.outputs.csa }}"
          docker build \
            -t "${{ env.CSA_IMAGE }}:${TAG}" \
            -t "${{ env.CSA_IMAGE }}:latest" \
            .
          docker save \
            "${{ env.CSA_IMAGE }}:${TAG}" \
            "${{ env.CSA_IMAGE }}:latest" \
            | gzip > ../csa-image.tar.gz

      - name: Ensure compose dir on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: mkdir -p ${{ env.COMPOSE_DIR }}

      - name: Upload compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: compose/docker-compose.yml,compose/.env.example
          target: ${{ env.COMPOSE_DIR }}
          strip_components: 1

      - name: Upload image tarballs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: api-gateway-image.tar.gz,csa-image.tar.gz
          target: ${{ env.COMPOSE_DIR }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: LOGIN_TOKEN,POSTGRES_PASSWORD,API_GATEWAY_TAG,CSA_TAG
          script: |
            set -euo pipefail
            cd ${{ env.COMPOSE_DIR }}

            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            if [ -n "${LOGIN_TOKEN:-}" ]; then
              sed -i "s|^LOGIN_TOKEN=.*|LOGIN_TOKEN=${LOGIN_TOKEN}|" .env
            fi
            if [ -n "${POSTGRES_PASSWORD:-}" ]; then
              sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|" .env
              sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/demo|" .env
            fi
            sed -i "s|^API_GATEWAY_TAG=.*|API_GATEWAY_TAG=${API_GATEWAY_TAG}|" .env
            sed -i "s|^CUSTOMER_SUPPORT_TAG=.*|CUSTOMER_SUPPORT_TAG=${CSA_TAG}|" .env

            gunzip -c api-gateway-image.tar.gz | docker load
            gunzip -c csa-image.tar.gz | docker load
            rm -f api-gateway-image.tar.gz csa-image.tar.gz

            docker compose pull postgres redis
            docker compose up -d postgres redis
            docker compose run --rm customer-support-agent alembic upgrade head
            docker compose run --rm api-gateway alembic upgrade head
            docker compose up -d customer-support-agent api-gateway
        env:
          LOGIN_TOKEN: ${{ secrets.LOGIN_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          API_GATEWAY_TAG: ${{ steps.tag.outputs.api_gateway }}
          CSA_TAG: ${{ steps.tag.outputs.csa }}
